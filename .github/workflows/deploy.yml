name: Docker Deployment Health Check

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t rollback-app:new .
          docker tag rollback-app:new ghcr.io/${{ github.repository_owner }}/rollback-health-lab:v1

      - name: Push stable image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/rollback-health-lab:v1

      - name: Run application
        run: |
          docker rm -f rollback-app || true
          docker run -d --name rollback-app -p 9095:80 rollback-app:new

      - name: Health Check
        run: |
          for i in 1 2 3 4 5
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9095)
            echo "Health check $i: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi

            sleep 3
          done

          echo "Health check failed."
          exit 1

      - name: Rollback
        if: failure()
        run: |
          echo "Health check failed. Starting rollback..."
          docker rm -f rollback-app || true
          docker pull ghcr.io/${{ github.repository_owner }}/rollback-health-lab:v1
          docker run -d --name rollback-app -p 9095:80 \
            ghcr.io/${{ github.repository_owner }}/rollback-health-lab:v1
          echo "Rollback completed."
